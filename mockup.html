function Icon(name, cls = 'w-5 h-5', label = '') {
  const a11y = label ? `role="img" aria-label="${label}"` : 'aria-hidden="true" focusable="false"';
  return `<svg ${a11y} class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name] || ''}</svg>`;
}

/* ============================== 3. UI ==================================== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const href = path => `#${path}`;
const cx = (...c) => c.filter(Boolean).join(' ');

function Logo({ dark = false } = {}) {
  const word = dark ? '#FFFFFF' : '#153B4A';
  const sub = dark ? 'rgba(255,255,255,.72)' : '#4A5C63';
  return `
  <span class="inline-flex items-center gap-2.5">
    <svg aria-hidden="true" viewBox="0 0 40 40" class="w-9 h-9 flex-none">
      <rect width="40" height="40" rx="11" fill="${dark ? '#1C4C5E' : '#153B4A'}"/>
      <path d="M11 28V17a6 6 0 0 1 6-6h12" fill="none" stroke="#E8A35D" stroke-width="3.6" stroke-linecap="round"/>
      <circle cx="26" cy="25" r="4.4" fill="none" stroke="#fff" stroke-width="2.8"/>
    </svg>
    <span class="leading-none">
      <span class="block font-display font-extrabold text-[1.15rem] tracking-[-0.02em]" style="color:${word}">Oakline</span>
      <span class="block text-[0.72rem] font-medium mt-0.5" style="color:${sub}">Plumbing Co.</span>
    </span>
  </span>`;
}

function Button({ label, to, variant = 'primary', icon, size = '', attrs = '', cls = '' }) {
  const ic = icon ? Icon(icon, 'w-[18px] h-[18px]') : '';
  const c = cx('btn', `btn-${variant}`, size && `btn-${size}`, cls);
  if (to) return `<a href="${href(to)}" class="${c}" ${attrs}>${ic}<span>${label}</span></a>`;
  return `<button type="button" class="${c}" ${attrs}>${ic}<span>${label}</span></button>`;
}

// Phone CTAs never dial in the demo: they open an explanation dialog.
function CallButton({ label = 'Call Now', variant = 'secondary', size = '', cls = '', showNumber = false } = {}) {
  const text = showNumber ? `${label} ${SITE.phoneDisplay}` : label;
  return Button({ label: text, variant, size, icon: 'phone', cls, attrs: 'data-action="call"' });
}

function DemoTag(text = 'Demo content') {
  return `<span class="demo-tag">${Icon('info', 'w-3.5 h-3.5')}${text}</span>`;
}

function Image({ src, alt, ratio = 'aspect-[4/3]', cls = '', tag = 'Illustrative image', icon = 'tools', eager = false }) {
  return `
  <figure class="img-frame ${ratio} ${cls}">
    <img src="${src}" alt="${esc(alt)}" loading="${eager ? 'eager' : 'lazy'}" decoding="async" data-fallback>
    <div class="img-fallback" hidden>
      <span class="w-14 h-14 rounded-2xl bg-white/80 grid place-items-center shadow-card">${Icon(icon, 'w-7 h-7')}</span>
      <span class="text-sm font-semibold max-w-[30ch]">${esc(alt)}</span>
    </div>
    ${tag ? `<figcaption class="img-tag">${tag}</figcaption>` : ''}
  </figure>`;
}

function SectionHeading({ title, intro = '', align = 'left', id = '', level = 2 }) {
  const center = align === 'center';
  return `
  <div class="${center ? 'text-center mx-auto' : ''} max-w-2xl mb-10 md:mb-12">
    <h${level} ${id ? `id="${id}"` : ''} class="h2">${title}</h${level}>
    ${intro ? `<p class="lede mt-4 ${center ? 'mx-auto' : ''}">${intro}</p>` : ''}
  </div>`;
}

function Eyebrow(text) {
  return `<p class="inline-flex items-center gap-2.5 text-[0.95rem] font-semibold text-copper-700 mb-4">
    <span aria-hidden="true" class="inline-block w-7 h-[3px] rounded-full bg-copper"></span>${text}</p>`;
}

function Breadcrumbs(items) {
  return `
  <nav aria-label="Breadcrumb" class="mb-6">
    <ol class="flex flex-wrap items-center gap-1.5 text-sm text-charcoal-70">
      ${items.map((it, i) => {
        const last = i === items.length - 1;
        return `<li class="flex items-center gap-1.5">
          ${last ? `<span aria-current="page" class="font-semibold text-teal">${it.label}</span>`
                 : `<a href="${href(it.to)}" class="hover:text-teal underline-offset-4 hover:underline">${it.label}</a>
                    <span aria-hidden="true" class="text-charcoal-50">/</span>`}
        </li>`;
      }).join('')}
    </ol>
  </nav>`;
}

let accSeq = 0;
function Accordion(items, { cls = '' } = {}) {
  return `<div class="divide-y divide-[#CFE0DD] border-y border-[#CFE0DD] ${cls}" data-accordion>
    ${items.map(it => {
      const id = `acc-${++accSeq}`;
      return `
      <div class="acc-item" data-open="false">
        <h3>
          <button type="button" class="w-full flex items-center justify-between gap-6 text-left py-5 min-h-[64px] font-display font-bold text-[1.07rem] text-teal hover:text-teal-600"
            aria-expanded="false" aria-controls="${id}" id="${id}-btn" data-acc-trigger>
            <span>${it.q}</span>
            <span class="acc-icon flex-none w-9 h-9 rounded-full bg-aqua grid place-items-center text-teal">${Icon('x', 'w-4 h-4 rotate-45')}</span>
          </button>
        </h3>
        <div class="acc-panel" id="${id}" role="region" aria-labelledby="${id}-btn">
          <div><div class="pb-6 pr-12 text-charcoal-70 measure" data-acc-body>
            <p>${it.a}</p>
            ${it.link ? `<p class="mt-3"><a href="${href(it.link.to)}" class="text-link" tabindex="-1">${it.link.label}</a></p>` : ''}
          </div></div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function IconBadge(name, tone = 'aqua') {
  const tones = { aqua: 'bg-aqua text-teal', copper: 'bg-copper-100 text-copper-700', teal: 'bg-teal text-white', white: 'bg-white text-teal' };
  return `<span class="inline-grid place-items-center w-12 h-12 rounded-[14px] ${tones[tone]} flex-none">${Icon(name, 'w-6 h-6')}</span>`;
}

function ProofSlot({ title, body, icon = 'quote', cls = '' }) {
  return `
  <div class="proof-slot p-6 md:p-7 ${cls}">
    <div class="flex items-start gap-4">
      <span class="w-11 h-11 rounded-xl bg-white grid place-items-center text-teal flex-none border border-[#CFE0DD]">${Icon(icon, 'w-5 h-5')}</span>
      <div>
        <p class="font-display font-bold text-teal">${title}</p>
        <p class="text-[0.95rem] text-charcoal-70 mt-1">${body}</p>
      </div>
    </div>
  </div>`;
}

function Notice({ tone = 'info', title, body, cls = '', attrs = '' }) {
  const map = {
    info: { wrap: 'bg-white border-[#B9D3D0]', ic: 'info', icc: 'text-teal' },
    warn: { wrap: 'bg-copper-100 border-[#F1CFA8]', ic: 'alert', icc: 'text-copper-700' },
    error: { wrap: 'bg-[#FEF3F2] border-[#F4B8B1]', ic: 'alert', icc: 'text-danger' },
    success: { wrap: 'bg-[#ECF7F1] border-[#A8D8C0]', ic: 'checkCircle', icc: 'text-success' }
  }[tone];
  return `<div class="flex gap-3 rounded-2xl border p-4 md:p-5 ${map.wrap} ${cls}" ${attrs}>
    <span class="${map.icc} flex-none mt-0.5">${Icon(map.ic, 'w-5 h-5')}</span>
    <div class="text-[0.95rem]">${title ? `<p class="font-semibold text-teal">${title}</p>` : ''}<div class="${title ? 'mt-1' : ''} text-charcoal">${body}</div></div>
  </div>`;
}

/* ============================ 4. SECTIONS ================================ */
function ServiceCard(s, { variant = 'compact' } = {}) {
  if (variant === 'full') {
    return `
    <article class="group bg-white rounded-panel border border-[#D6E5E2] shadow-card overflow-hidden flex flex-col card-link">
      ${Image({ src: s.image, alt: s.imageAlt, ratio: 'aspect-[16/9]', icon: s.icon })}
      <div class="p-6 md:p-8 flex flex-col flex-1">
        <div class="flex items-center gap-3 mb-3">${IconBadge(s.icon, 'copper')}<h3 class="h3 text-[1.35rem]">${s.name}</h3></div>
        <p class="text-charcoal-70">${s.directory.overview}</p>
        <p class="font-semibold text-teal mt-5 text-[0.95rem]">Common reasons people call</p>
        <ul class="mt-2 space-y-2">
          ${s.directory.problems.map(p => `<li class="flex gap-2.5 text-[0.97rem]"><span class="text-copper-600 mt-1">${Icon('check', 'w-4 h-4')}</span>${p}</li>`).join('')}
        </ul>
        <div class="mt-auto pt-7 flex flex-wrap gap-3">
          ${Button({ label: `Explore ${s.navLabel}`, to: `/services/${s.slug}`, variant: 'primary', size: 'sm' })}
          ${Button({ label: 'Request Service', to: `/contact?service=${s.slug}`, variant: 'secondary', size: 'sm' })}
        </div>
      </div>
    </article>`;
  }
  return `
  <a href="${href(`/services/${s.slug}`)}" class="group bg-white rounded-panel border border-[#D6E5E2] shadow-card overflow-hidden flex flex-col card-link">
    ${Image({ src: s.image, alt: s.imageAlt, ratio: 'aspect-[3/2]', icon: s.icon, tag: '' })}
    <div class="p-6 flex flex-col flex-1">
      <span class="text-copper-700 mb-3">${Icon(s.icon, 'w-6 h-6')}</span>
      <h3 class="h3">${s.name}</h3>
      <p class="text-teal font-semibold mt-2 text-[0.97rem]">${s.problem}</p>
      <p class="text-charcoal-70 mt-2 text-[0.97rem]">${s.summary}</p>
      <span class="mt-auto pt-5 inline-flex items-center gap-1.5 font-semibold text-teal">
        <span class="underline decoration-copper decoration-2 underline-offset-4 group-hover:decoration-teal">View service</span>
        <span class="sr-only">: ${s.name}</span>${Icon('chevRight', 'w-4 h-4 transition-transform group-hover:translate-x-0.5')}
      </span>
    </div>
  </a>`;
}

// Interactive symptom → service matcher. Suggests, never diagnoses.
function SymptomFinder({ extended = false, id = 'finder' } = {}) {
  const list = SYMPTOMS.filter(s => extended || !s.extended);
  return `
  <div class="bg-white rounded-panel border border-[#D6E5E2] shadow-card p-6 md:p-10" data-finder="${id}">
    <p id="${id}-label" class="font-display font-bold text-teal text-lg">What are you noticing?</p>
    <p class="text-charcoal-70 text-[0.95rem] mt-1">Pick the closest match to see which service page to read first.</p>
    <div class="flex flex-wrap gap-2.5 mt-5" role="group" aria-labelledby="${id}-label">
      ${list.map(s => `<button type="button" class="chip" aria-pressed="false" data-symptom="${s.id}">${Icon(s.icon, 'w-[18px] h-[18px]')}${s.label}</button>`).join('')}
    </div>
    <div class="mt-6 min-h-[132px]" data-finder-result aria-live="polite">${FinderEmpty()}</div>
    <p class="mt-5 text-[0.95rem]">Not sure? <a href="${href('/contact?service=other')}" class="text-link">Tell us what’s happening</a> and the team can help sort it out.</p>
  </div>`;
}

function FinderEmpty() {
  return `<div class="h-full rounded-2xl bg-soft border border-[#E1ECEA] p-5 flex items-center gap-4 text-charcoal-70">
    <span class="text-teal">${Icon('search', 'w-6 h-6')}</span>
    <p class="text-[0.95rem]">Choose a symptom above. You’ll see a suggested starting point, not a diagnosis.</p>
  </div>`;
}

function SymptomResult(sym) {
  const s = SVC[sym.service];
  return `
  <div class="rounded-2xl bg-aqua-50 border border-[#B9D3D0] p-5 md:p-6 flex flex-col md:flex-row md:items-center gap-5 page-enter">
    ${IconBadge(s.icon, 'teal')}
    <div class="flex-1">
      <p class="text-sm font-semibold text-copper-700">Suggested starting point</p>
      <p class="font-display font-bold text-teal text-lg">${s.name}</p>
      <p class="text-[0.95rem] text-charcoal-70 mt-1">${sym.note} The cause is confirmed only after an in-person look.</p>
    </div>
    <div class="flex flex-wrap gap-2.5">
      ${Button({ label: 'Read about it', to: `/services/${s.slug}`, variant: 'secondary', size: 'sm' })}
      ${Button({ label: s.cta, to: `/contact?service=${s.slug}`, variant: 'primary', size: 'sm' })}
    </div>
  </div>`;
}

// Signature element: steps connected by a "pipe" that fills with copper once.
function ProcessPipe(steps = PROCESS, { note = 'Example process for this concept. A live site would describe the company’s actual workflow.' } = {}) {
  return `
  <div data-pipe>
    <ol class="hidden md:grid relative" style="grid-template-columns: repeat(${steps.length}, minmax(0,1fr)); column-gap: 24px;">
      <div aria-hidden="true" class="pipe-track" style="left: 34px; right: calc((100% - ${(steps.length - 1) * 24}px) / ${steps.length} - 34px);"><div class="pipe-flow"></div></div>
      ${steps.map((st, i) => `
        <li class="pipe-step relative">
          <span class="pipe-joint" aria-hidden="true">${i + 1}</span>
          <h3 class="h3 mt-6"><span class="sr-only">Step ${i + 1}: </span>${st.t}</h3>
          <p class="text-charcoal-70 mt-2 text-[0.97rem] pr-4">${st.d}</p>
        </li>`).join('')}
    </ol>
    <ol class="md:hidden relative space-y-8">
      <div aria-hidden="true" class="pipe-vert"><div class="pipe-flow"></div></div>
      ${steps.map((st, i) => `
        <li class="pipe-step relative flex gap-5">
          <span class="pipe-joint flex-none" aria-hidden="true">${i + 1}</span>
          <div class="pt-3"><h3 class="h3"><span class="sr-only">Step ${i + 1}: </span>${st.t}</h3><p class="text-charcoal-70 mt-1.5 text-[0.97rem]">${st.d}</p></div>
        </li>`).join('')}
    </ol>
    ${note ? `<p class="mt-10 text-sm text-charcoal-70 flex items-center gap-2">${Icon('info', 'w-4 h-4 text-teal')}${note}</p>` : ''}
  </div>`;
}

function FactorGrid(items, { cols = 'sm:grid-cols-2 lg:grid-cols-3', numbered = false, tone = 'white' } = {}) {
  const bg = tone === 'white' ? 'bg-white border border-[#D6E5E2]' : 'bg-white/70 border border-white';
  return `<ul class="grid gap-4 md:gap-5 ${cols}">
    ${items.map((it, i) => `
      <li class="${bg} rounded-card p-5 md:p-6">
        ${numbered ? `<span class="font-display font-extrabold text-copper-600 text-sm">Step ${i + 1}</span>` : ''}
        <p class="font-display font-bold text-teal text-[1.05rem] ${numbered ? 'mt-1' : ''}">${it.t}</p>
        <p class="text-charcoal-70 mt-1.5 text-[0.96rem]">${it.d}</p>
      </li>`).join('')}
  </ul>`;
}

function CompareCards(c) {
  const col = (side, accent) => `
    <div class="rounded-panel p-6 md:p-8 ${accent ? 'bg-teal text-white on-dark' : 'bg-white border border-[#D6E5E2]'}">
      <div class="flex items-center gap-3">
        ${IconBadge(side.icon, accent ? 'white' : 'aqua')}
        <h3 class="h3 text-[1.25rem] ${accent ? '!text-white' : ''}">${side.t}</h3>
      </div>
      <ul class="mt-6 space-y-3.5">
        ${side.items.map(i => `<li class="flex gap-3 ${accent ? 'text-white/90' : 'text-charcoal'}"><span class="${accent ? 'text-copper' : 'text-copper-600'} mt-1 flex-none">${Icon('check', 'w-4 h-4')}</span><span>${i}</span></li>`).join('')}
      </ul>
    </div>`;
  return `
    <div class="grid md:grid-cols-2 gap-5 md:gap-6">${col(c.a, false)}${col(c.b, true)}</div>

}

function FeaturedProject({ compact = false } = {}) {

    { k: 'Assessment', v: 'Technician checks nearby fixtures to see whether the blockage is local or further down the line.' },

function CoverageMap() {

/* ----------------------------- Inquiry form ------------------------------ */
let formSeq = 0;
function InquiryForm({ variant = 'short', preset = '', heading = '' } = {}) {
  const id = `f${++formSeq}`;
  const full = variant === 'full';
  const field = (name, label, { required = false, type = 'text', hint = '', ac = '', inputmode = '', placeholder = '', span = '' } = {}) => `
    <div class="${span}">
      <label for="${id}-${name}" class="field-label">${label} ${required ? '<span class="req-mark" aria-hidden="true">*</span><span class="sr-only">(required)</span>' : '<span class="font-normal text-charcoal-70 text-sm">(optional)</span>'}</label>
      <input id="${id}-${name}" name="${name}" type="${type}" class="field-input" ${required ? 'required aria-required="true"' : ''} ${ac ? `autocomplete="${ac}"` : ''} ${inputmode ? `inputmode="${inputmode}"` : ''} ${placeholder ? `placeholder="${placeholder}"` : ''} aria-describedby="${hint ? `${id}-${name}-hint ` : ''}${id}-${name}-err">
      ${hint ? `<p id="${id}-${name}-hint" class="field-hint">${hint}</p>` : ''}
      <p id="${id}-${name}-err" class="field-error" hidden></p>
    </div>`;

  return `
  <form novalidate class="space-y-5" data-inquiry-form data-variant="${variant}" aria-labelledby="${id}-title">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <h3 id="${id}-title" class="h3 text-[1.3rem]">${heading || 'Service request'}</h3>
      ${DemoTag('Demo form — nothing is sent')}
    </div>
    <p class="text-sm text-charcoal-70">Fields marked <span class="req-mark">*</span> are required.</p>
    <div data-error-summary hidden tabindex="-1" class="rounded-2xl border border-[#F4B8B1] bg-[#FEF3F2] p-4">
      <p class="font-semibold text-danger flex items-center gap-2">${Icon('alert', 'w-5 h-5')}<span data-summary-title>Please check the highlighted fields</span></p>
      <ul class="mt-2 list-disc pl-6 text-[0.95rem] text-charcoal" data-summary-list></ul>
    </div>
    <div class="grid sm:grid-cols-2 gap-5">
      ${field('name', 'Full name', { required: true, ac: 'name', span: 'sm:col-span-2' })}
      ${field('phone', 'Phone', { required: true, type: 'tel', ac: 'tel', inputmode: 'tel', hint: 'Any format works, such as (704) 555-0123.' })}
      ${field('zip', 'ZIP code', { required: true, ac: 'postal-code', inputmode: 'numeric', hint: 'Used to check coverage first.' })}
      <div class="sm:col-span-2">
        <label for="${id}-service" class="field-label">Service needed <span class="req-mark" aria-hidden="true">*</span><span class="sr-only">(required)</span></label>
        <select id="${id}-service" name="service" class="field-input" required aria-required="true" aria-describedby="${id}-service-err">
          <option value="">Choose a service</option>
          ${SERVICE_OPTIONS.map(o => `<option value="${o.value}" ${o.value === preset ? 'selected' : ''}>${o.label}</option>`).join('')}
        </select>
        <p id="${id}-service-err" class="field-error" hidden></p>
      </div>
      <div class="sm:col-span-2">
        <label for="${id}-desc" class="field-label">What’s happening? <span class="font-normal text-charcoal-70 text-sm">(optional)</span></label>
        <textarea id="${id}-desc" name="description" class="field-input" maxlength="800" aria-describedby="${id}-desc-hint" placeholder="For example: kitchen sink has been slow for a week, and the dishwasher drains slowly too."></textarea>
        <p id="${id}-desc-hint" class="field-hint">Where the problem is, what you’ve noticed, and how long it’s been happening.</p>
      </div>
      ${full ? `
      <fieldset class="sm:col-span-2">
        <legend class="field-label">How urgent is it? <span class="font-normal text-charcoal-70 text-sm">(optional)</span></legend>
        <div class="grid sm:grid-cols-3 gap-2.5 mt-1">
          ${[['planned', 'Planning ahead'], ['soon', 'Needs attention soon'], ['urgent', 'Urgent']].map(([v, l]) => `
            <label class="radio-pill relative"><input type="radio" name="urgency" value="${v}" data-urgency><span><span class="dot"></span>${l}</span></label>`).join('')}
        </div>
        <div data-urgent-note hidden class="mt-3">${Notice({ tone: 'warn', title: 'For urgent problems, please call', body: `Active leaks, backups, or no water are best handled by phone. The form isn’t monitored like a phone line. <button type="button" class="text-link" data-action="call">See the number</button>` })}</div>
      </fieldset>
      ${field('email', 'Email', { type: 'email', ac: 'email', span: 'sm:col-span-2', hint: 'Only if you’d like a second way to be reached.' })}
      <div class="sm:col-span-2">
        <label for="${id}-photo" class="field-label">Photo <span class="font-normal text-charcoal-70 text-sm">(optional, disabled in demo)</span></label>
        <input id="${id}-photo" type="file" class="field-input pt-3" disabled aria-describedby="${id}-photo-hint">
        <p id="${id}-photo-hint" class="field-hint">Uploads stay off until secure handling and retention are defined for a real business.</p>
      </div>` : ''}
    </div>
    <div class="rounded-2xl bg-soft border border-[#E1ECEA] p-4">
      <label class="flex items-start gap-3 text-sm cursor-pointer">
        <input type="checkbox" name="simulateFailure" class="mt-0.5 w-5 h-5 accent-[#153B4A] flex-none">
        <span><span class="font-semibold text-teal">Demo control:</span> simulate a failed send to preview the error and retry state.</span>
      </label>
    </div>
    <div data-form-status></div>
    <div class="flex flex-col sm:flex-row sm:items-center gap-4 pt-1">
      <button type="submit" class="btn btn-primary w-full sm:w-auto" data-submit>
        <span data-submit-label>Send Service Request</span>
      </button>
      <p class="text-sm text-charcoal-70">Prefer to talk? <button type="button" class="text-link" data-action="call">Call instead</button></p>
    </div>
    <p class="text-sm text-charcoal-70 flex items-start gap-2">${Icon('lock', 'w-4 h-4 mt-0.5 text-teal flex-none')}<span>Sending a request doesn’t book an appointment. In this demo, details stay in your browser and are cleared when you leave. Read the <a href="${href('/privacy')}" class="text-link">privacy notice</a>.</span></p>
  </form>`;
}

/* ============================== 7. ROUTER ================================ */
const State = { lastSubmission: null, submitting: false, firstRender: true };

const ROUTES = [
  { path: '/', page: 'home', title: 'Residential Plumbing in Charlotte | Oakline Plumbing Co. (Concept)', desc: 'Concept homepage for a fictional Charlotte plumbing company: services, how requests work, coverage, and a short request form.' },
  { path: '/services', page: 'services', title: 'Residential Plumbing Services | Oakline Plumbing Co. (Concept)', desc: 'Concept services directory: drain cleaning, leak repair, water heaters, and sewer lines, with help finding the right service by symptom.' },
  ...SERVICES.map(s => ({ path: `/services/${s.slug}`, page: 'service', slug: s.slug, title: s.meta.title, desc: s.meta.desc })),
  { path: '/about', page: 'about', title: 'About Oakline Plumbing Co. | Portfolio Concept', desc: 'Concept About page showing where a real plumbing company’s owner story, team, standards, and verified credentials would appear.' },
  { path: '/reviews-projects', page: 'reviews', title: 'Example Project & Review Layouts | Oakline Concept', desc: 'Concept layouts for genuine reviews and project stories. No fabricated testimonials or ratings are shown.' },
  { path: '/service-areas', page: 'areas', title: 'Charlotte Service Area | Oakline Plumbing Co. (Concept)', desc: 'Concept service area page centered on Charlotte, NC, with a demo ZIP check and accessible coverage list.' },
  { path: '/contact', page: 'contact', title: 'Request Plumbing Service | Oakline Plumbing Co. (Concept)', desc: 'Concept contact page with a call option for urgent issues and a demo service request form.' },
  { path: '/thank-you', page: 'thankYou', title: 'Request Received | Oakline Plumbing Co. (Concept)', desc: 'Demo request confirmation page.' },
  { path: '/privacy', page: 'privacy', title: 'Privacy Notice | Oakline Plumbing Co. (Concept)', desc: 'How this concept site handles form information.' },
  { path: '/terms', page: 'terms', title: 'Website Terms | Oakline Plumbing Co. (Concept)', desc: 'Terms for using this concept site.' }
];

function parseLocation() {
  const raw = location.hash.startsWith('#/') ? location.hash.slice(1) : '/';
  const [pathPart, queryPart = ''] = raw.split('?');
  let path = pathPart.replace(/\/+$/, '') || '/';
  const query = Object.fromEntries(new URLSearchParams(queryPart));
  return { path, query };
}

function navigate(path) { location.hash = path; }

function render() {
  const loc = parseLocation();
  const match = ROUTES.find(r => r.path === loc.path);
  const route = { ...loc, ...(match || { page: 'notFound', title: 'Page Not Found | Oakline Plumbing Co. (Concept)', desc: 'This page could not be found.' }) };

  closeMenu(false); closeModal(false); closeDropdowns();

  document.getElementById('concept-banner').innerHTML = ConceptBanner();
  document.getElementById('site-header').innerHTML = Header(route);
  document.getElementById('mobile-menu-root').innerHTML = MobileMenu(route);
  document.getElementById('mobile-bar').innerHTML = MobileBar(route);
  if (!document.getElementById('call-modal')) document.getElementById('modal-root').innerHTML = CallModal();
  if (!document.getElementById('site-footer').innerHTML) document.getElementById('site-footer').innerHTML = Footer();

  const main = document.getElementById('main');
  main.innerHTML = `<div class="page-enter">${route.page === 'service' ? ServicePage(route.slug) : Pages[route.page](route)}</div>`;

  document.title = route.title;
  document.querySelector('meta[name="description"]').setAttribute('content', route.desc);

  const root = document.documentElement;
  root.style.scrollBehavior = 'auto';
  window.scrollTo(0, 0);
  requestAnimationFrame(() => { root.style.scrollBehavior = ''; });

  hydrate(main);

  if (!State.firstRender) {
    const h1 = main.querySelector('[data-page-h1]');
    if (h1) h1.focus({ preventScroll: true });
    announce(`${route.title.split('|')[0].trim()} page loaded`);
  }
  State.firstRender = false;
}

function announce(msg) {
  const lr = document.getElementById('live-region');
  lr.textContent = '';
  setTimeout(() => { lr.textContent = msg; }, 60);
}

/* ============================= 8. BEHAVIOR =============================== */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastFocus = null;

function focusables(el) {
  return [...el.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])')]
    .filter(n => n.offsetParent !== null || n === document.activeElement);
}
function trapFocus(container, e) {
  if (e.key !== 'Tab') return;
  const f = focusables(container); if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* Modal */
function openModal() {
  const m = document.getElementById('call-modal'); if (!m) return;
  lastFocus = document.activeElement;
  m.dataset.open = 'true'; document.body.style.overflow = 'hidden';
  setTimeout(() => m.querySelector('[data-modal-close].btn, .modal-card button')?.focus(), 30);
}
function closeModal(restore = true) {
  const m = document.getElementById('call-modal'); if (!m || m.dataset.open !== 'true') return;
  m.dataset.open = 'false'; document.body.style.overflow = '';
  if (restore && lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

/* Mobile menu */
function openMenu() {
  const m = document.getElementById('mobile-menu'); if (!m) return;
  lastFocus = document.activeElement;
  m.dataset.open = 'true'; document.body.style.overflow = 'hidden';
  document.querySelector('[data-menu-open]')?.setAttribute('aria-expanded', 'true');
  setTimeout(() => m.querySelector('button[data-menu-close]')?.focus(), 40);
}
function closeMenu(restore = true) {
  const m = document.getElementById('mobile-menu'); if (!m || m.dataset.open !== 'true') return;
  m.dataset.open = 'false'; document.body.style.overflow = '';
  document.querySelector('[data-menu-open]')?.setAttribute('aria-expanded', 'false');
  if (restore) document.querySelector('[data-menu-open]')?.focus();
}

/* Dropdown */
function setDropdown(dd, open) {
  const trig = dd.querySelector('[data-dropdown-trigger]'), panel = dd.querySelector('[data-dropdown-panel]');
  trig.setAttribute('aria-expanded', String(open)); panel.dataset.open = String(open);
  trig.querySelector('svg')?.classList.toggle('rotate-180', open);
}
function closeDropdowns(except) {
  document.querySelectorAll('[data-dropdown]').forEach(dd => { if (dd !== except) setDropdown(dd, false); });
}

/* Accordion */
function toggleAccordion(btn) {
  const item = btn.closest('.acc-item');
  const open = item.dataset.open !== 'true';
  item.dataset.open = String(open);
  btn.setAttribute('aria-expanded', String(open));
  item.querySelectorAll('[data-acc-body] a, [data-acc-body] button').forEach(a => open ? a.removeAttribute('tabindex') : a.setAttribute('tabindex', '-1'));
}

/* Hydration after each render: things delegation can't handle */
function hydrate(root) {
  root.querySelectorAll('img[data-fallback]').forEach(img => {
    const fail = () => { img.hidden = true; img.nextElementSibling.hidden = false; };
    if (img.complete && img.naturalWidth === 0) fail(); else img.addEventListener('error', fail, { once: true });
  });
  const pipes = root.querySelectorAll('[data-pipe]');
  if (reduceMotion || !('IntersectionObserver' in window)) pipes.forEach(p => p.classList.add('pipe-on'));
  else {
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('pipe-on'); io.unobserve(en.target); }
    }), { threshold: 0.35 });
    pipes.forEach(p => io.observe(p));
  }
}

/* ----------------------------- Form logic ------------------------------- */
const Validators = {
  name: v => v.trim().length < 2 ? 'Enter your full name so the team knows who to ask for.' : '',
  phone: v => {
    if (!v.trim()) return 'Enter a phone number so the team can follow up.';
    if (!/^[\d\s()+.\-]+$/.test(v)) return 'Use numbers only, with spaces, dashes, or brackets if you like.';
    const d = v.replace(/\D/g, '');
    return (d.length === 10 || (d.length === 11 && d[0] === '1')) ? '' : 'Enter a 10-digit US phone number, such as (704) 555-0123.';
  },
  zip: v => !v.trim() ? 'Enter your ZIP code so coverage can be checked.' : (/^\d{5}(-\d{4})?$/.test(v.trim()) ? '' : 'Enter a 5-digit ZIP code, such as 28202.'),
  service: v => v ? '' : 'Choose the service you need, or pick “Other / Not sure”.',
  email: v => !v.trim() ? '' : (/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) ? '' : 'Check the email address, or leave it blank. It’s optional.')
};
const FIELD_LABELS = { name: 'Full name', phone: 'Phone', zip: 'ZIP code', service: 'Service needed', email: 'Email' };

function setFieldError(input, msg) {
  const err = document.getElementById(`${input.id}-err`);
  input.setAttribute('aria-invalid', msg ? 'true' : 'false');
  if (!err) return;
  err.hidden = !msg;
  err.innerHTML = msg ? `${Icon('alert', 'w-4 h-4 mt-0.5 flex-none')}<span>${msg}</span>` : '';
}

function validateForm(form) {
  const errors = [];
  Object.keys(Validators).forEach(name => {
    const input = form.elements[name]; if (!input) return;
    const msg = Validators[name](input.value);
    setFieldError(input, msg);
    if (msg) errors.push({ input, msg, label: FIELD_LABELS[name] });
  });
  const summary = form.querySelector('[data-error-summary]');
  if (errors.length) {
    summary.hidden = false;
    summary.querySelector('[data-summary-title]').textContent = errors.length === 1 ? 'One field needs attention' : `${errors.length} fields need attention`;
    summary.querySelector('[data-summary-list]').innerHTML = errors.map(e => `<li><a href="#" class="text-link" data-jump="${e.input.id}">${e.label}: ${e.msg}</a></li>`).join('');
  } else summary.hidden = true;
  return errors;
}

function setSubmitting(form, on) {
  const btn = form.querySelector('[data-submit]');
  State.submitting = on;
  btn.disabled = on; btn.setAttribute('aria-busy', String(on));
  btn.innerHTML = on ? `<span class="spinner" aria-hidden="true"></span><span>Sending request…</span>` : `<span data-submit-label>Send Service Request</span>`;
}

function handleInquirySubmit(form) {
  if (State.submitting) return;               // prevents duplicate sends
  form.dataset.attempted = 'true';
  const status = form.querySelector('[data-form-status]');
  status.innerHTML = '';
  const errors = validateForm(form);
  if (errors.length) {
    const summary = form.querySelector('[data-error-summary]');
    summary.focus();
    return;
  }
  setSubmitting(form, true);
  const failing = form.elements.simulateFailure?.checked;
  setTimeout(() => {
    setSubmitting(form, false);
    if (failing) {
      status.innerHTML = Notice({ tone: 'error', attrs: 'role="alert"', title: 'Your request wasn’t sent', body: `The connection to the request service failed. Everything you entered is still here. <button type="button" class="text-link" data-retry>Try again</button> or <button type="button" class="text-link" data-action="call">call instead</button>.` });
      status.querySelector('[data-retry]')?.focus();
      return;
    }
    const opt = SERVICE_OPTIONS.find(o => o.value === form.elements.service.value);
    // Only non-sensitive context is kept, in memory, for the confirmation screen.
    State.lastSubmission = { serviceLabel: opt ? opt.label : 'service' };
    form.reset();
    navigate('/thank-you');
  }, 1200);
}

function handleZipSubmit(form) {
  const input = form.elements.zip, out = form.querySelector('[data-zip-result]');
  const v = input.value.trim();
  const msg = Validators.zip(v);
  setFieldError(input, msg);
  if (msg) { out.innerHTML = ''; input.focus(); return; }
  const z = v.slice(0, 5);
  let tone, title, body;
  if (/^282/.test(z)) {
    tone = 'success'; title = 'This ZIP is in the Charlotte area';
    body = 'That’s the focus of this concept. Staff would still confirm your exact address before any visit.';
  } else if (/^2[78]/.test(z)) {
    tone = 'info'; title = 'Outside the demo focus';
    body = 'This North Carolina ZIP isn’t in Charlotte. A live site would check it against the verified coverage list. You could still call or send a request to ask.';
  } else {
    tone = 'warn'; title = 'Likely outside the area';
    body = 'This ZIP isn’t in North Carolina. A real Charlotte company would likely not cover it, but you can call to check.';
  }
  out.innerHTML = Notice({ tone, title, body: `${body}<div class="mt-4 flex flex-wrap gap-3">${Button({ label: 'Request service', to: '/contact', size: 'sm' })}${CallButton({ size: 'sm', label: 'Call to confirm' })}</div><p class="text-xs text-charcoal-70 mt-3">Demo check based on ZIP prefix only.</p>` });
}

/* ------------------------- Global event delegation ---------------------- */
document.addEventListener('click', e => {
  const t = e.target;

  if (t.closest('#skipLink')) { e.preventDefault(); document.getElementById('main').focus(); return; }

  const call = t.closest('[data-action="call"]');
  if (call) { e.preventDefault(); closeMenu(false); openModal(); return; }

  if (t.closest('[data-modal-close]')) { closeModal(!t.closest('a')); if (!t.closest('a')) return; }

  if (t.closest('[data-menu-open]')) { openMenu(); return; }
  if (t.closest('[data-menu-close]')) { closeMenu(); return; }

  const trig = t.closest('[data-dropdown-trigger]');
  if (trig) { const dd = trig.closest('[data-dropdown]'); const open = trig.getAttribute('aria-expanded') !== 'true'; closeDropdowns(dd); setDropdown(dd, open); return; }
  if (!t.closest('[data-dropdown]')) closeDropdowns();

  const acc = t.closest('[data-acc-trigger]');
  if (acc) { toggleAccordion(acc); return; }

  const scrollBtn = t.closest('[data-scroll-to]');
  if (scrollBtn) {
    const key = scrollBtn.dataset.scrollTo;
    const target = document.querySelector(`[data-scroll-target="${key}"]`) || document.getElementById(key);
    if (target) {
      target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
      setTimeout(() => {
        if (scrollBtn.hasAttribute('data-focus-first')) target.querySelector('input, select, textarea')?.focus({ preventScroll: true });
        else target.focus({ preventScroll: true });
      }, reduceMotion ? 0 : 450);
    }
    return;
  }

  const jump = t.closest('[data-jump]');
  if (jump) { e.preventDefault(); const el = document.getElementById(jump.dataset.jump); el?.focus(); el?.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' }); return; }

  const retry = t.closest('[data-retry]');
  if (retry) { const form = retry.closest('form'); handleInquirySubmit(form); return; }

  const sym = t.closest('[data-symptom]');
  if (sym) {
    const finder = sym.closest('[data-finder]');
    const wasOn = sym.getAttribute('aria-pressed') === 'true';
    finder.querySelectorAll('[data-symptom]').forEach(b => b.setAttribute('aria-pressed', 'false'));
    const result = finder.querySelector('[data-finder-result]');
    if (wasOn) { result.innerHTML = FinderEmpty(); return; }
    sym.setAttribute('aria-pressed', 'true');
    result.innerHTML = SymptomResult(SYMPTOMS.find(s => s.id === sym.dataset.symptom));
    return;
  }

  const filt = t.closest('[data-filter]');
  if (filt) {
    const wrap = filt.closest('[data-gallery-filters]');
    wrap.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b === filt)));
    const cat = filt.dataset.filter;
    document.querySelectorAll('[data-gallery] [data-cat]').forEach(li => { li.hidden = !(cat === 'all' || li.dataset.cat === cat); });
    announce(`Showing ${cat === 'all' ? 'all' : SVC[cat].navLabel} placeholders`);
    return;
  }

  // Close mobile menu when a link inside it is followed
  if (t.closest('#mobile-menu a')) closeMenu(false);
});

document.addEventListener('submit', e => {
  const form = e.target;
  if (form.matches('[data-inquiry-form]')) { e.preventDefault(); handleInquirySubmit(form); }
  else if (form.matches('[data-zip-form]')) { e.preventDefault(); handleZipSubmit(form); }
});

// Re-validate a field as the person fixes it (only after a first attempt)
document.addEventListener('input', e => {
  const input = e.target, form = input.closest('[data-inquiry-form]');
  if (!form || form.dataset.attempted !== 'true' || !Validators[input.name]) return;
  if (input.getAttribute('aria-invalid') === 'true') setFieldError(input, Validators[input.name](input.value));
});
document.addEventListener('focusout', e => {
  const input = e.target, form = input.closest && input.closest('[data-inquiry-form]');
  if (!form || form.dataset.attempted !== 'true' || !Validators[input.name]) return;
  setFieldError(input, Validators[input.name](input.value));
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-urgency]')) {
    const note = e.target.closest('fieldset').querySelector('[data-urgent-note]');
    note.hidden = e.target.value !== 'urgent';
  }
});

document.addEventListener('keydown', e => {
  const modal = document.getElementById('call-modal');
  const menu = document.getElementById('mobile-menu');
  if (e.key === 'Escape') {
    if (modal?.dataset.open === 'true') { closeModal(); return; }
    if (menu?.dataset.open === 'true') { closeMenu(); return; }
    const openDd = document.querySelector('[data-dropdown-panel][data-open="true"]');
    if (openDd) { const dd = openDd.closest('[data-dropdown]'); setDropdown(dd, false); dd.querySelector('[data-dropdown-trigger]').focus(); }
    return;
  }
  if (modal?.dataset.open === 'true') return trapFocus(modal.querySelector('.modal-card'), e);
  if (menu?.dataset.open === 'true') return trapFocus(menu.querySelector('.sheet'), e);

  // Dropdown arrow-key support
  const dd = e.target.closest && e.target.closest('[data-dropdown]');
  if (dd && ['ArrowDown', 'ArrowUp'].includes(e.key)) {
    e.preventDefault();
    const items = [...dd.querySelectorAll('[data-dropdown-item]')];
    if (e.target.matches('[data-dropdown-trigger]')) { setDropdown(dd, true); items[e.key === 'ArrowDown' ? 0 : items.length - 1].focus(); return; }
    const i = items.indexOf(e.target);
    if (i > -1) items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
  }
});

// Close dropdown when focus leaves it
document.addEventListener('focusin', e => {
  document.querySelectorAll('[data-dropdown]').forEach(dd => { if (!dd.contains(e.target)) setDropdown(dd, false); });
});

// Desktop hover intent for the services dropdown
let ddTimer;
document.addEventListener('mouseover', e => {
  const dd = e.target.closest && e.target.closest('[data-dropdown]');
  if (!dd || !window.matchMedia('(hover: hover) and (min-width: 1024px)').matches) return;
  clearTimeout(ddTimer); closeDropdowns(dd); setDropdown(dd, true);
});
document.addEventListener('mouseout', e => {
  const dd = e.target.closest && e.target.closest('[data-dropdown]');
  if (!dd || dd.contains(e.relatedTarget)) return;
  if (!window.matchMedia('(hover: hover) and (min-width: 1024px)').matches) return;
  ddTimer = setTimeout(() => { if (!dd.contains(document.activeElement)) setDropdown(dd, false); }, 180);
});

window.addEventListener('hashchange', render);
window.addEventListener('resize', () => { if (window.innerWidth >= 1024) closeMenu(false); });
render();
</script>
</body>
